<title>Textos legales / Legal texts · BulkCreate</title>
<style>
:root { color-scheme: light dark; --bg: #fdf7f2; --text: #1f1d2b; --muted: #5b5870; --border: #d9d3e0; --link: #1d6f86; --surface: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #15141c; --text: #ecebf2; --muted: #a9a6ba; --border: #3a3848; --link: #7cc7dc; --surface: #1d1c26; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", Roboto, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 8px; }
header strong { font-size: 18px; }
nav a { margin-left: 12px; }
a { color: var(--link); }
.meta { color: var(--muted); font-size: 14px; }
h1 { font-size: 28px; line-height: 1.25; }
h2 { font-size: 20px; margin-top: 32px; }
h3 { font-size: 17px; margin-top: 20px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; background: var(--surface); }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 24px; }
.card { border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; background: var(--surface); }
.card ul { padding-left: 18px; }
</style>
</head>
<body>
<main>

</html>
